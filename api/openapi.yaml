openapi: 3.1.0
info:
  title: C2PA Verify API
  version: 0.1.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    Public API for verifying C2PA Content Credentials on image assets.

    **Host is a placeholder.** `https://api.creds.im` is reserved for
    the production deployment; until then treat every path as relative to this
    server's `/v1` base.

    Authentication uses bearer API keys (`Authorization: Bearer c2pa_live_…`).
    `c2pa_test_…` keys run against the sandbox and never bill quota.

    All error responses use `application/problem+json` (RFC 9457) with an
    additional machine-readable `code` member.
tags:
  - name: verify
    description: Synchronous single-asset verification (≤ 20 MiB).
  - name: jobs
    description: Asynchronous verification for larger assets or `url` inputs.
  - name: trust
    description: Active trust-list provenance.
servers:
  - url: https://api.creds.im/v1
    description: Production (placeholder host)
security:
  - bearerAuth: []
paths:
  /verify:
    post:
      tags: [verify]
      summary: Verify one image asset
      description: |
        Runs the full C2PA + EXIF pipeline and returns a `VerifyResult`.
        Synchronous only — request bodies are capped at 20 MiB
        (`max_sync_bytes`); larger assets must go through `POST /jobs`.

        Input is either `multipart/form-data` (`file`), or `application/json`
        with exactly one of `data` (base64) or `url`. Options may be supplied
        as query parameters or, for JSON bodies, as body fields; query wins.
      operationId: verifyAsset
      parameters:
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/Trust'
        - $ref: '#/components/parameters/StripGps'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Image file (JPEG/PNG/GIF/WebP).
                include:
                  type: string
                  description: Comma-separated section list (see `include` param).
                trust:
                  type: string
                  enum: [c2pa, c2pa_and_itl]
                strip_gps:
                  type: boolean
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [data]
                  properties:
                    data:
                      type: string
                      description: Base64-encoded image bytes.
                    mime:
                      type: string
                      description: MIME type of `data` (e.g. `image/jpeg`).
                    filename:
                      type: string
                    include:
                      type: string
                    trust:
                      type: string
                      enum: [c2pa, c2pa_and_itl]
                    strip_gps:
                      type: boolean
                  # Exactly one input: any presence of a `url` key — even a
                  # null value — is rejected in the data branch.
                  not:
                    required: [url]
                    # Declared only so schema linters can resolve the required
                    # key above; meaningless inside `not`.
                    properties:
                      url: { type: 'null' }
                - type: object
                  required: [url]
                  properties:
                    url:
                      type: string
                      format: uri
                      description: Public http(s) URL of the image.
                    filename:
                      type: string
                    mime:
                      type: string
                    include:
                      type: string
                    trust:
                      type: string
                      enum: [c2pa, c2pa_and_itl]
                    strip_gps:
                      type: boolean
                  # Exactly one input: any presence of a `data` key — even a
                  # null value — is rejected in the url branch.
                  not:
                    required: [data]
                    # Declared only so schema linters can resolve the required
                    # key above; meaningless inside `not`.
                    properties:
                      data: { type: 'null' }
      responses:
        '200':
          description: Verification result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResult'
              examples:
                valid_untrusted:
                  summary: C.jpg — valid signature, signer not on a trust list
                  # Real toApiResult output for fixtures/C.jpg (engine
                  # c2pa-wasm 0.11.6, trust lists as of 2026-11-24).
                  value:
                    id: ver_b0bd686b-4bff-4df1-820e-5cf20c11457d
                    engine:
                      name: c2pa-wasm
                      version: "0.11.6"
                      trust_lists:
                        c2pa:
                          commit: 285d98e4b575198180c1d6404a7ee1a317e04911
                          date: "2026-11-20T18:47:23Z"
                        itl:
                          fetched_at: "2026-11-24T21:27:29.826Z"
                    status: valid_untrusted
                    trust:
                      basis: none
                    validation:
                      state: Valid
                      success:
                        - code: timeStamp.validated
                          explanation: "timestamp message digest matched: DigiCert Timestamp 2023"
                          url: "self#jumbf=/c2pa/contentauth:urn:uuid:c85a2b90-f1a0-4aa4-b17f-f938b475804e/c2pa.signature"
                        - code: timeStamp.trusted
                          explanation: "timestamp cert trusted: DigiCert Timestamp 2023"
                          url: "self#jumbf=/c2pa/contentauth:urn:uuid:c85a2b90-f1a0-4aa4-b17f-f938b475804e/c2pa.signature"
                        - code: claimSignature.insideValidity
