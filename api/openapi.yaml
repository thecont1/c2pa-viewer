        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/UpstreamFetchFailed'
  /jobs:
    get:
      tags: [jobs]
      summary: List recent jobs for the calling key
      operationId: listJobs
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: before
          in: query
          required: false
          schema: { type: string }
          description: created_at cursor from a previous page's next_cursor.
      responses:
        '200':
          description: Page of jobs, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [jobs, next_cursor]
                properties:
                  jobs:
                    type: array
                    items:
                      type: object
                      properties:
                        job_id: { type: string }
                        status: { type: string, enum: [queued, awaiting_upload, processing, succeeded, failed] }
                        filename: { type: [string, "null"] }
                        size_bytes: { type: [integer, "null"] }
                        error: { type: [object, "null"] }
                        created_at: { type: string }
                        completed_at: { type: [string, "null"] }
                  next_cursor: { type: [string, "null"] }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [jobs]
      summary: Enqueue an asynchronous verification job
      description: |
        For assets over the 20 MiB sync cap or `url` inputs that are slow to
        fetch. Returns `202` with a job handle; poll `GET /jobs/{job_id}` or
        supply `webhook_url` for a `job.completed` callback.

        `Idempotency-Key` (optional header): repeating a request with the same
        key returns `200` with the original job's acceptance payload (its
        creation-time status, not the current state — poll `GET /jobs/{job_id}`
        for that) instead of enqueueing a duplicate.
      operationId: createJob
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreate'
      responses:
        '202':
          description: Job accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCreated'
              example:
                job_id: job_01JZX4K8Q2MNBVCXZ
                status: awaiting_upload
                upload:
                  url: https://uploads.creds.im/job_01JZX4K8Q2MNBVCXZ
                  method: PUT
                  headers:
                    content-type: image/jpeg
                  expires_at: "2026-11-24T22:27:29Z"
        '200':
          description: Same-key replay. Returns the original job's acceptance payload, not its current status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
  /jobs/{job_id}:
    get:
      tags: [jobs]
      summary: Poll a verification job
      operationId: getJob
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Current job state; `result` present when `succeeded`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              example:
                job_id: job_01JZX4K8Q2MNBVCXZ
                status: processing
                created_at: "2026-11-24T21:30:00Z"
                completed_at: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Unknown job id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.creds.im/problems/job_not_found
                title: Job not found
                status: 404
                code: job_not_found
        '429':
          $ref: '#/components/responses/RateLimited'
  /trust-lists:
    get:
      tags: [trust]
      summary: Active trust lists and their provenance
      description: Mirrors `trust/meta.json` — which C2PA Trust List commit and ITL snapshot produced the verdicts.
      operationId: getTrustLists
      security: []
      responses:
        '200':
          description: Trust-list metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustLists'
              example:
                fetched_at: "2026-11-24T21:27:29.826Z"
                lists:
                  c2pa:
                    source_url: https://raw.githubusercontent.com/c2pa-org/conformance-public/main/trust-list/C2PA-TRUST-LIST.pem
