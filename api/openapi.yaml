        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /openapi.json:
    get:
      tags: [trust]
      summary: This OpenAPI document
      operationId: getOpenApi
      security: []
      responses:
        '200':
          description: The OpenAPI 3.1 document itself.
          content:
            application/json:
              schema: { type: object }
  /signup/free:
    post:
      tags: [keys]
      summary: Create a free-tier API key (self-service signup)
      operationId: signupFree
      security: []
      description: |
        The single unauthenticated write surface. Requires a Cloudflare
        Turnstile token; per-IP rate limited. The plaintext key is returned
        exactly once — only its hash is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [turnstile_token]
              properties:
                turnstile_token: { type: string }
                name: { type: string, maxLength: 120 }
      responses:
        '201':
          description: Key created. Store the plaintext — it is never shown again.
          content:
            application/json:
              schema:
                type: object
                required: [key, display_prefix, tier, quota_monthly, created_at]
                properties:
                  key: { type: string, example: c2pa_live_… }
                  display_prefix: { type: string }
                  tier: { type: string, enum: [free] }
                  quota_monthly: { type: integer, example: 500 }
                  created_at: { type: string }
                  notice: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /key:
    get:
      tags: [keys]
      summary: Metadata and current-month usage for the calling key
      operationId: getKey
      responses:
        '200':
          description: Key metadata with current-month usage snapshot.
          content:
            application/json:
              schema:
                type: object
                properties:
                  display_prefix: { type: string }
                  name: { type: [string, "null"] }
                  type: { type: string, enum: [server, browser] }
                  tier: { type: string, enum: [free, sync_only, sync_async] }
                  scopes: { type: array, items: { type: string } }
                  quota_monthly: { type: [integer, "null"] }
                  billing_status: { type: string, enum: [none, active, past_due, unpaid, canceled] }
                  created_at: { type: string }
                  rotated_at: { type: [string, "null"] }
                  usage:
                    type: object
                    properties:
                      month: { type: string, example: '2026-11' }
                      verify_count: { type: integer }
                      bytes_total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /usage:
    get:
      tags: [keys]
      summary: Monthly usage history for the calling key (up to 12 months)
      operationId: getUsage
      responses:
        '200':
          description: Monthly usage rows, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  quota_monthly: { type: [integer, "null"] }
                  months:
                    type: array
                    items:
                      type: object
                      properties:
                        month: { type: string }
                        verify_count: { type: integer }
                        bytes_total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /key/rotate:
    post:
      tags: [keys]
      summary: Rotate the calling key — issues a successor, revokes this one immediately
      operationId: rotateKey
      description: |
        The successor inherits tier, quota, type, origins, scopes, name and the
        Stripe billing linkage. The previous key stops working the moment the
        rotation commits — there is no overlap window.
      responses:
        '200':
          description: Successor key. Store the plaintext — it is never shown again.
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: { type: string }
                  display_prefix: { type: string }
                  rotated_at: { type: string }
                  notice: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /key/revoke:
    post:
      tags: [keys]
      summary: Revoke the calling key permanently
      operationId: revokeKey
      responses:
        '200':
          description: Key revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: boolean }
                  display_prefix: { type: string }
                  revoked_at: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /billing/checkout:
    post:
      tags: [billing]
      summary: Create a Stripe checkout session for a paid tier
      operationId: createCheckout
      security: []
      description: |
        Optional bearer auth: an authenticated key upgrades in place (the
        plaintext never changes); an anonymous caller starts the keyless
        new-customer flow (Turnstile required) and reveals the key once at
        /billing/reveal after payment. 503 billing_not_configured when the
        deployment has no billing provider attached.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tier]
              properties:
                tier: { type: string, enum: [sync_only, sync_async] }
                units:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 1
                  description: >-
                    Quota units — quota_monthly = units x 10,000 (sync_only) or
                    units x 25,000 (sync_async). Changeable later via the
                    customer portal's quantity selector.
                period:
                  type: string
                  enum: [month, year]
                  default: month
                turnstile_token: { type: string }
      responses:
        '201':
          description: Checkout session created — redirect the user to checkout_url.
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkout_url: { type: string }
                  session_id: { type: string }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503':
          description: Billing not configured.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /billing/reveal:
    get:
      tags: [billing]
      summary: Reveal the key provisioned by a keyless checkout (exactly once)
      operationId: revealKey
      security: []
      parameters:
        - name: session_id
          in: query
          required: true
          schema: { type: string }
      description: |
        Verifies the checkout session with Stripe, provisions the key in that
        instant, and returns the plaintext in the same response — plaintext
        never rests at storage. The first successful reveal wins; every later
        attempt is 410.
      responses:
        '201':
          description: Key provisioned and revealed. Store it now.
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: { type: string }
                  display_prefix: { type: string }
                  tier: { type: string }
                  quota_monthly: { type: integer }
                  created_at: { type: string }
                  notice: { type: string }
        '402':
          description: Checkout session not yet paid.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '410':
          description: Key already revealed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /billing/portal:
    post:
      tags: [billing]
      summary: Create a Stripe customer portal session for the calling key
      operationId: createPortal
      responses:
        '200':
          description: Portal session — redirect the user to portal_url.
          content:
            application/json:
              schema:
                type: object
                properties:
                  portal_url: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /billing/webhook:
    post:
      tags: [billing]
      summary: Stripe webhook receiver (signature-authenticated)
      operationId: stripeWebhook
      security: []
      description: |
        Server-to-server endpoint for Stripe events. Authentication is the
        Stripe-Signature header — callers cannot use this endpoint without the
        webhook signing secret. Handles tier upgrades, downgrades and
        payment-failure lifecycle.
      responses:
        '200':
          description: Event acknowledged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
webhooks:
  jobCompleted:
    post:
      operationId: jobCompletedWebhook
      summary: Job completion callback
      # Outbound callback: the receiver does not present this API's bearer key.
      # Authentication is the X-C2PA-Signature HMAC described below.
      security: []
      parameters:
        - name: X-C2PA-Signature
          in: header
          required: true
          schema: { type: string }
          description: '`t=<unix>,v1=<hex>` — hex is HMAC-SHA256 of `"<t>.<raw body>"` keyed by the webhook signing secret.'
      description: |
        Sent to the job's `webhook_url` when a job reaches `succeeded` or
        `failed`. Signed with `X-C2PA-Signature: t=<unix>,v1=<hex>` where the
        hex is HMAC-SHA256 of the string `"<t>.<raw body>"` keyed by the
        webhook signing secret shown at key issuance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event, job]
              properties:
                event:
                  type: string
                  enum: [job.completed]
                job:
                  $ref: '#/components/schemas/Job'
      responses:
        '200':
          description: Acknowledged.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer c2pa_live_…` for production keys,
        `c2pa_test_…` for sandbox keys.
  parameters:
    Include:
      name: include
      in: query
      required: false
      schema:
        type: string
        default: exif,iptc
      examples:
        default: { value: "exif,iptc" }
        all: { value: "exif,iptc,gps,thumbnails,raw_manifest" }
      description: |
        Comma-separated result sections: `exif`, `iptc`, `gps`,
        `thumbnails`, `raw_manifest`. Default `exif,iptc`. Sections not
        listed are omitted from the response. `gps` is still suppressed when
        `strip_gps=true`.
    Trust:
      name: trust
      in: query
      required: false
      schema:
        type: string
        enum: [c2pa, c2pa_and_itl]
        default: c2pa_and_itl
      description: |
        Which trust lists may produce a `trusted` verdict. `c2pa` accepts only
        the official C2PA Trust List; `c2pa_and_itl` (default) also accepts the
        frozen Interim Trust List used by Adobe's current signing pipeline —
        the `trust.basis` field reports which list matched.
    StripGps:
      name: strip_gps
      in: query
      required: false
      schema: { type: boolean, default: true }
      description: |
        When true (default), `metadata.gps` is null and no GPS data appears anywhere in the response.
        For `raw_manifest` this means assertion payloads are redacted recursively before return:
        every object key whose final namespace component (the part after the last `:`) starts with
        `gps` or is exactly `latitude`/`longitude` (case-insensitive) is dropped at any depth.
  headers:
    RateLimitLimit:
      description: Requests allowed per window.
      schema: { type: integer }
    RateLimitRemaining:
      description: Requests remaining in the current window.
      schema: { type: integer }
    RateLimitReset:
      description: Seconds until the window resets.
      schema: { type: integer }
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: { type: integer }
  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing or invalid API key.
      headers:
        WWW-Authenticate: { schema: { type: string } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.creds.im/problems/unauthorized
            title: Unauthorized
            status: 401
            code: unauthorized
    Forbidden:
      description: Key valid but lacks permission (e.g. live-only endpoint on a test key).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.creds.im/problems/forbidden
            title: Forbidden
            status: 403
            code: forbidden
    PayloadTooLarge:
      description: Body exceeds the 20 MiB synchronous cap.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  max_sync_bytes:
                    type: integer
                    description: Hard synchronous size cap in bytes.
                  hint:
                    type: string
                    description: Suggested alternative.
          example:
            type: https://api.creds.im/problems/payload_too_large
            title: Payload Too Large
            status: 413
            code: payload_too_large
            max_sync_bytes: 20971520
            hint: Use POST /v1/jobs for assets larger than 20 MiB.
    UnsupportedMediaType:
      description: Unsupported Content-Type or image format.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.creds.im/problems/unsupported_media_type
            title: Unsupported Media Type
            status: 415
            code: unsupported_media_type
    Unprocessable:
      description: Well-formed request that cannot be processed (bad base64, unfetchable URL, invalid options).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.creds.im/problems/invalid_request
            title: Unprocessable Entity
            status: 422
            code: invalid_request
    RateLimited:
      description: Rate or quota limit hit.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
        RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
        RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.creds.im/problems/rate_limited
            title: Too Many Requests
            status: 429
            code: rate_limited
    UpstreamFetchFailed:
      description: The asset URL could not be fetched.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.creds.im/problems/upstream_fetch_failed
            title: Upstream Fetch Failed
            status: 502
            code: upstream_fetch_failed
    InternalError:
      description: Unexpected server error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.creds.im/problems/internal_error
            title: Internal Server Error
            status: 500
            code: internal_error
  schemas:
    Code:
      type: object
      required: [code, explanation]
      additionalProperties: false
      properties:
        code:
          type: string
          description: Machine-readable validation code (c2pa-rs, e.g. `claimSignature.validated`).
        explanation:
          type: [string, 'null']
          description: Human-readable explanation from the validator.
        url:
          type: string
          description: JUMBF/self URI the code applies to, when available.
    VerifyResult:
      type: object
      required: [id, engine, status, trust, validation, active_manifest, provenance, metadata, asset]
      additionalProperties: false
      properties:
        id:
          type: string
          description: Server-assigned result id (`ver_…`).
        engine:
          type: object
          required: [name, version, trust_lists]
          additionalProperties: false
          properties:
            name: { type: string, description: Validation engine identifier. }
            version: { type: string, description: Engine version. }
            trust_lists:
              type: object
              required: [c2pa, itl]
              additionalProperties: false
              properties:
                c2pa:
                  type: object
                  required: [commit, date]
                  additionalProperties: false
                  properties:
                    commit: { type: [string, 'null'], description: Upstream commit sha of the C2PA Trust List. }
                    date: { type: [string, 'null'], description: Commit date of that revision. }
                itl:
                  type: object
                  required: [fetched_at]
                  additionalProperties: false
                  properties:
                    fetched_at: { type: [string, 'null'], description: Fetch timestamp of the ITL snapshot. }
        status:
          type: string
          enum: [trusted, valid_untrusted, invalid, no_manifest]
          description: |
            Rolled-up verdict. `trusted` — signer matched a trust list;
            `valid_untrusted` — signature valid but signer on no list;
            `invalid` — validation failure; `no_manifest` — no C2PA manifest.
        trust:
          type: object
          required: [basis]
          additionalProperties: false
          properties:
            basis:
              type: [string, 'null']
              enum: [c2pa_trust_list, interim_trust_list, none, null]
              description: Which list produced trust, `none` when valid-but-untrusted, null when not evaluated.
        validation:
          type: object
          required: [state, success, informational, failure]
          additionalProperties: false
          properties:
            state:
              type: [string, 'null']
              enum: [Valid, Invalid, Trusted, null]
              description: Manifest-store validation_state.
            success: { type: array, items: { $ref: '#/components/schemas/Code' }, description: Passed checks. }
            informational: { type: array, items: { $ref: '#/components/schemas/Code' }, description: Informational checks. }
            failure: { type: array, items: { $ref: '#/components/schemas/Code' }, description: Failed checks. }
        active_manifest:
          type: [object, 'null']
          required: [label, claim_generator, signer, digital_source_type, author, actions, ingredients]
          additionalProperties: false
          properties:
            label:
              type: [string, 'null']
              description: Manifest store label (e.g. `contentauth:urn:uuid:…`).
            claim_generator: { type: [string, 'null'], description: Claim generator string. }
            signer:
              type: object
              required: [issuer, common_name, serial_number, signed_at]
              additionalProperties: false
              properties:
                issuer: { type: [string, 'null'] }
                common_name: { type: [string, 'null'] }
                serial_number: { type: [string, 'null'] }
                signed_at: { type: [string, 'null'], format: date-time, description: RFC 3339 signing time. }
            digital_source_type:
              type: [object, 'null']
              required: [code, label]
              additionalProperties: false
              properties:
                code: { type: string }
                label: { type: string }
            author:
              type: [object, 'null']
              description: CreativeWork assertion data (schema.org), null when absent.
            actions:
              type: array
              items: { type: object }
              description: C2PA actions performed on the asset.
            ingredients:
              type: array
              items: { type: object }
              description: Manifest ingredients (source assets).
        provenance:
          type: array
          items: { type: object }
          description: Human-readable provenance rows (same rows the viewer renders, incl. Signer Trust).
        metadata:
          type: object
          required: [dimensions]
          additionalProperties: false
          properties:
            exif:
              type: object
              description: EXIF tag map (present when `include` has `exif`).
            iptc:
              type: object
              description: IPTC field map (present when `include` has `iptc`).
            gps:
              type: [object, 'null']
              description: '{latitude, longitude} or null — always null when strip_gps=true (present when `include` has `gps`).'
            dimensions:
              type: object
              required: [width, height]
              additionalProperties: false
              properties:
                width: { type: [integer, 'null'] }
                height: { type: [integer, 'null'] }
        asset:
          type: object
          required: [sha256, mime, bytes, width, height]
          additionalProperties: false
          properties:
            sha256:
              type: string
              pattern: '^[0-9a-f]{64}$'
              description: SHA-256 of the exact submitted bytes.
            mime: { type: [string, 'null'], description: MIME type used for parsing. }
            bytes: { type: integer, description: Input size in bytes. }
            width: { type: [integer, 'null'] }
            height: { type: [integer, 'null'] }
        thumbnails:
          type: object
          additionalProperties: false
          description: Present only when `include` has `thumbnails`.
          properties:
            claim_thumbnail:
              type: object
              required: [mime, data_base64]
              additionalProperties: false
              properties:
                mime: { type: string }
                data_base64: { type: string, description: Base64 image bytes. }
            ingredient_thumbnails:
              type: array
              items:
                type: object
                required: [mime, data_base64]
                additionalProperties: false
                properties:
                  mime: { type: string }
                  data_base64: { type: string }
        raw_manifest:
          type: [object, 'null']
          description: Full extracted manifest data (present only when `include` has `raw_manifest`).
    MiniResult:
      type: object
      required: [creator, digital_source_type, issued_by, issued_on, status, more]
      additionalProperties: false
      properties:
        creator: { type: [string, 'null'], description: Manifest author/creator name. }
        digital_source_type: { type: [string, 'null'], description: Human-readable source-type label. }
        issued_by: { type: [string, 'null'], description: Signing credential issuer. }
        issued_on: { type: [string, 'null'], description: Formatted signing timestamp. }
        status:
          type: string
          enum: [Authenticity Verified, Unverified]
          description: Badge status — `Authenticity Verified` only for Valid/Trusted validation_state.
        trust:
          type: object
          additionalProperties: false
          properties:
            state: { type: [string, 'null'], enum: [Trusted, Valid, Invalid, null] }
            basis: { type: [string, 'null'], enum: [c2pa_trust_list, interim_trust_list, none, null] }
          description: Trust resolution (present on API responses; absent in legacy viewer output).
        more:
          type: string
          format: uri
          description: Link to the full verification result for this asset.
    JobCreate:
      type: object
      additionalProperties: false
      properties:
        url: { type: string, format: uri, description: Asset URL to fetch and verify. }
        filename: { type: string, description: Display filename hint. }
        mime: { type: string, description: Expected MIME type. }
        size_bytes: { type: integer, description: "Expected size, used for upload-session sizing. Async assets are capped at 20 MiB by default; larger caps are privately negotiated per key." }
        webhook_url: { type: string, format: uri, description: Callback for job.completed. }
        include:
          type: string
          description: Comma-separated section list (same values as /verify `include`).
        trust: { type: string, enum: [c2pa, c2pa_and_itl], default: c2pa_and_itl }
        strip_gps: { type: boolean, default: true }
      description: Provide `url` to fetch server-side, or omit it to receive an upload URL.
    JobCreated:
      type: object
      required: [job_id, status, upload]
      additionalProperties: false
      properties:
        job_id: { type: string }
        status:
          type: string
          enum: [queued, awaiting_upload]
          description: '`queued` when a URL fetch was scheduled; `awaiting_upload` when the client must PUT bytes first.'
        upload:
          type: [object, 'null']
          required: [url, method, headers, expires_at]
          additionalProperties: false
          properties:
            url: { type: string, format: uri }
            method: { type: string, enum: [PUT] }
            headers: { type: object, additionalProperties: { type: string } }
            expires_at: { type: string, format: date-time }
    Job:
      type: object
      required: [job_id, status, created_at]
      additionalProperties: false
      allOf:
        - if:
            properties: { status: { const: succeeded } }
            required: [status]
          then:
            required: [result]
            properties:
              result:
                $ref: '#/components/schemas/VerifyResult'
        - if:
            properties: { status: { const: failed } }
            required: [status]
          then:
            required: [error]
            properties:
              error:
                $ref: '#/components/schemas/Problem'
      properties:
        job_id: { type: string }
        status:
          type: string
          enum: [queued, awaiting_upload, processing, succeeded, failed]
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        result:
          $ref: '#/components/schemas/VerifyResult'
          description: Present when status is `succeeded`.
        error:
          $ref: '#/components/schemas/Problem'
          description: Present when status is `failed`.
    TrustLists:
      type: object
      required: [fetched_at, lists]
      additionalProperties: false
      properties:
        fetched_at: { type: string, format: date-time }
        lists:
          type: object
          required: [c2pa, itl, config]
          additionalProperties: false
          properties:
            c2pa:
              type: object
              required: [source_url, fetched_at, sha256, cert_count, commit, commit_date]
              additionalProperties: false
              properties:
                source_url: { type: string, format: uri }
                fetched_at: { type: string, format: date-time }
                sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
                cert_count: { type: integer }
                commit: { type: string, description: Upstream git commit sha. }
                commit_date: { type: string, format: date-time }
            itl:
              type: object
