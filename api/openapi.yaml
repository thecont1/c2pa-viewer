  /verify/mini:
    get:
      tags: [verify]
      summary: Compact trust card for an image URL
      description: |
        Lightweight variant of `/verify` for URL inputs — returns the same
        verdict fields as the viewer's `c2paMini` badge plus the trust
        resolution. Cheap enough for embeds and link previews.
      operationId: verifyMini
      parameters:
        - name: url
          in: query
          required: true
          schema: { type: string, format: uri }
          description: Public http(s) URL of the image.
        - $ref: '#/components/parameters/Trust'
      responses:
        '200':
          description: Compact verification card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiniResult'
              examples:
                verified:
                  # Shape mirrors fixtures/golden/*.c2paMini.json plus `trust`.
                  value:
                    creator: Adobe make_test
                    digital_source_type: Algorithmic Media
                    issued_by: C2PA Test Signing Cert
                    issued_on: Sep 29, 2023 at 11:10 PM GMT+5:30
                    status: Authenticity Verified
                    trust:
                      state: Valid
                      basis: none
                    more: https://creds.im/?uri=https%3A%2F%2Fexample.com%2Fphoto.jpg
                unverified:
                  value:
                    creator: null
                    digital_source_type: null
                    issued_by: null
                    issued_on: null
                    status: Unverified
                    trust:
                      state: null
                      basis: null
                    more: https://creds.im/?uri=https%3A%2F%2Fexample.com%2Fplain.jpg
        '401':
