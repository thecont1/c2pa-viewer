name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # oven-sh/setup-bun major version v2; Bun itself is pinned to the repo's
      # development version for reproducible installs and test behavior.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright
        run: |
          version="$(sed -n 's/.*"playwright": "\([^"]*\)".*/\1/p' package.json | head -n 1)"
          if [ -z "$version" ]; then
            echo "could not resolve playwright version from package.json" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Browser cache key is deliberately keyed on the exact Playwright package
      # version (plus runner OS). linux: ~/.cache/ms-playwright.
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Build viewer assets
        run: bun run build

      # wrangler is pinned exactly in package.json/bun.lock (4.168.0); the API
      # tests execute that local node_modules binary. `wrangler dev --local`
      # works headlessly in CI because miniflare/workerd is installed with the
      # pinned package and no interactive login is required for local mode.
      - name: Viewer/unit/golden/OpenAPI tests
        run: bun run test

      - name: API smoke matrix
        run: bun run test:api

      - name: API contract completeness test
        run: bun run test:contract

  container:
    name: Rust container build + golden parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: api/container-rs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # ubuntu-latest ships rustup with stable Rust — no extra action needed.
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            api/container-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('api/container-rs/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build container (locked)
        run: cargo build --release --locked

      - name: Run golden parity against frozen Node references
        working-directory: .
        run: |
          api/container-rs/target/release/c2pa-verify-container &
          CONTAINER_PID=$!
          trap 'kill $CONTAINER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8080/health && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:8080/health
          TZ=UTC bun scripts/parity-container.mjs compare http://localhost:8080

      # The parity corpus includes cloud.jpg, whose remote manifest fetch
      # requires network egress — available on GitHub-hosted runners.
